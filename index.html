<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0B0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AG Autos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png">
<title>AG Autos — Gestão de Estoque</title>
<style>
:root{
  --preto:#0B0B0C; --carvao:#141417; --carvao2:#1B1B20; --carvao3:#232329;
  --linha:#2E2E36; --branco:#F4F4F6; --cinza:#9A9AA6; --cinza2:#6E6E7A;
  --vermelho:#E01020; --vermelho2:#FF3040; --vermelhoEsc:#8E0A14;
  --ouro:#C9A227; --verde:#22C55E; --ambar:#F59E0B; --azul:#3B82F6;
  --r:14px; --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--preto); color:var(--branco);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--vermelho2)}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#000 0%,#0d0d0f 100%);
  border-bottom:1px solid var(--linha);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:12px;
}
.logo{display:flex;align-items:center;gap:9px;line-height:1}
.logo .ag{
  font-weight:900;font-size:26px;letter-spacing:-1.5px;font-style:italic;
  color:var(--vermelho);text-shadow:0 0 18px rgba(224,16,32,.45);
}
.logo .bar{width:2px;height:24px;background:var(--vermelho);transform:skewX(-12deg);opacity:.85}
.logo .w{display:flex;flex-direction:column;gap:1px}
.logo .autos{font-weight:800;font-size:17px;letter-spacing:.5px}
.logo .multi{font-size:8px;letter-spacing:3.1px;color:var(--vermelho);font-weight:700}
header .sub{margin-left:auto;font-size:11px;color:var(--cinza2);text-align:right}

/* ---------- LAYOUT ---------- */
main{padding:16px 14px 8px;max-width:900px;margin:0 auto}
h2.tit{font-size:19px;margin:0 0 2px;font-weight:800;letter-spacing:-.3px}
p.sub{margin:0 0 14px;color:var(--cinza);font-size:13px}
.hide{display:none!important}

/* ---------- CARDS / KPI ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:var(--carvao);border:1px solid var(--linha);border-radius:var(--r);padding:13px 14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--vermelho)}
.kpi.g::after{background:var(--verde)} .kpi.a::after{background:var(--ambar)} .kpi.b::after{background:var(--azul)} .kpi.x::after{background:var(--cinza2)}
.kpi .lb{font-size:11px;color:var(--cinza);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .vl{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.6px}
.kpi .ft{font-size:11px;color:var(--cinza2);margin-top:3px}
.kpi.wide{grid-column:1/-1}

.card{background:var(--carvao);border:1px solid var(--linha);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .cnt{background:var(--carvao3);color:var(--cinza);font-size:11px;padding:2px 7px;border-radius:20px}

/* ---------- LISTA DE VEÍCULOS ---------- */
.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{display:flex;gap:12px;background:var(--carvao);border:1px solid var(--linha);border-radius:var(--r);padding:10px;text-align:left;width:100%;align-items:stretch}
.vcard:active{background:var(--carvao2)}
.vthumb{width:88px;height:70px;border-radius:10px;background:var(--carvao3) center/cover no-repeat;flex:0 0 88px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--cinza2)}
.vinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta{font-size:11.5px;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.vprice{font-weight:800;font-size:15px;display:flex;flex-direction:column;line-height:1.1}
.vprice small{font-size:9.5px;font-weight:600;color:var(--cinza2);text-transform:uppercase;letter-spacing:.6px}
.vthumb svg{width:34px;height:26px;stroke:var(--cinza2);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.vthumb{position:relative}
.nfoto{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.b-estoque{background:rgba(255,255,255,.10);color:#D8D8DE}
.b-reservado{background:rgba(245,158,11,.16);color:#FBBF24}
.b-vendido{background:rgba(34,197,94,.16);color:#4ADE80}
.b-consignado{background:rgba(201,162,39,.18);color:#E3C359}
.b-alerta{background:rgba(224,16,32,.18);color:#FF6B76}
.b-neutro{background:var(--carvao3);color:var(--cinza)}

/* ---------- FILTROS ---------- */
.filtros{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:20px;background:var(--carvao);border:1px solid var(--linha);color:var(--cinza);font-size:13px;font-weight:600;display:flex;align-items:center}
.chip.on{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.chip i{font-style:normal;background:rgba(255,255,255,.09);padding:1px 6px;border-radius:9px;font-size:11px;margin-left:5px}
.chip.on i{background:rgba(0,0,0,.24)}
.vazio svg{width:52px;height:52px;stroke:var(--cinza2);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
.busca{width:100%;min-height:var(--tap);background:var(--carvao);border:1px solid var(--linha);border-radius:12px;padding:0 14px;margin-bottom:12px}
.busca::placeholder{color:var(--cinza2)}

/* ---------- FORM ---------- */
label{display:block;font-size:11.5px;color:var(--cinza);font-weight:600;margin:0 0 5px;text-transform:uppercase;letter-spacing:.5px}
.f{margin-bottom:12px}
.f input,.f select,.f textarea{
  width:100%;min-height:var(--tap);background:var(--carvao2);border:1px solid var(--linha);
  border-radius:11px;padding:11px 13px;outline:none;
}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--vermelho)}
.hint{font-size:11.5px;color:var(--cinza2);margin-top:4px;min-height:14px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chkrow{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:0 4px}
.chkrow input{width:22px;height:22px;min-height:0;accent-color:var(--vermelho)}
.chkrow label{margin:0;text-transform:none;font-size:14px;color:var(--branco);letter-spacing:0}

/* ---------- BOTÕES ---------- */
.btn{min-height:var(--tap);border-radius:12px;padding:0 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-p{background:var(--vermelho);color:#fff}
.btn-p:active{background:var(--vermelhoEsc)}
.btn-s{background:var(--carvao3);color:var(--branco);border:1px solid var(--linha)}
.btn-g{background:rgba(34,197,94,.15);color:#4ADE80;border:1px solid rgba(34,197,94,.35)}
.btn-d{background:rgba(224,16,32,.12);color:#FF6B76;border:1px solid rgba(224,16,32,.3)}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn-sm{min-height:40px;font-size:13px;padding:0 13px;width:auto;border-radius:10px}

/* ---------- NAV ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(10,10,12,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--linha);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--cinza2);font-size:10px;font-weight:600;border-radius:10px;padding:4px 0}
nav button .ic{height:24px;display:flex;align-items:center;justify-content:center}
nav button .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--vermelho2)}
nav button.add .ic{background:var(--vermelho);color:#fff;width:44px;height:24px;border-radius:8px;box-shadow:0 3px 12px rgba(224,16,32,.4)}
nav button.add .ic svg{stroke-width:2.4}
nav button.add{color:var(--cinza)}

/* ---------- MODAL / SHEET ---------- */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--carvao);width:100%;max-width:900px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;border-top:1px solid var(--linha);padding:8px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.grab{width:38px;height:4px;background:var(--linha);border-radius:4px;margin:6px auto 12px}
.sheet h3{margin:0 0 14px;font-size:17px;font-weight:800}
.sheet .x{position:absolute;right:14px;top:14px}

/* ---------- DETALHE ---------- */
.hero{position:relative;border-radius:var(--r);overflow:hidden;background:var(--carvao2);border:1px solid var(--linha);height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;width:100%;padding:0}
.hero img{width:100%;height:100%;object-fit:cover}
.heroVazio{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--cinza2);font-size:13px}
.hero .ph svg{width:46px;height:46px;stroke:var(--cinza2);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.heroN{position:absolute;right:9px;bottom:9px;background:rgba(0,0,0,.65);padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700}
.acoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:8px;margin-bottom:14px}
.ac{min-height:var(--tap);background:var(--carvao);border:1px solid var(--linha);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px}
.ac b{font-size:13px;font-weight:700}
.ac span{font-size:10px;color:var(--cinza2)}
.ac:active{background:var(--carvao3)}
#qVender{background:var(--vermelho);border-color:var(--vermelho)}
#qVender span{color:rgba(255,255,255,.8)}
.gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.gal .g{flex:0 0 74px;height:60px;border-radius:9px;background:var(--carvao3) center/cover no-repeat;position:relative;border:2px solid transparent}
.gal .g.capa{border-color:var(--vermelho)}
.gal .g .del{position:absolute;top:-5px;right:-5px;width:22px;height:22px;border-radius:50%;background:var(--vermelho);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.gal .addph{flex:0 0 74px;height:60px;border-radius:9px;border:1px dashed var(--linha);display:flex;align-items:center;justify-content:center;color:var(--cinza);font-size:22px}

.tabs{display:flex;gap:6px;background:var(--carvao2);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1 0 auto;min-height:40px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--cinza);white-space:nowrap}
.tabs button.on{background:var(--vermelho);color:#fff}

.lin{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--linha);font-size:13.5px}
.lin:last-child{border-bottom:none}
.lin .k{color:var(--cinza)}
.lin .v{font-weight:600;text-align:right}
.lin.tot{border-top:1px solid var(--linha);margin-top:4px;padding-top:11px;font-size:15px}
.lin.tot .v{font-weight:800;font-size:16px}
.pos{color:var(--verde)} .neg{color:var(--vermelho2)}

.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:none}
.item .ib{flex:1;min-width:0}
.item .it{font-weight:600;font-size:13.5px}
.item .id{font-size:11.5px;color:var(--cinza);margin-top:2px}
.item .iv{font-weight:700;font-size:14px;white-space:nowrap}

.vazio{text-align:center;padding:38px 20px;color:var(--cinza2)}
.vazio .e{font-size:40px;margin-bottom:10px}
.vazio p{margin:0 0 4px;font-size:14px}
.vazio small{font-size:12px}

.alert{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha);font-size:13px}
.alert:last-child{border-bottom:none}
.alert .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.alert .tx{flex:1}
.alert .tx b{display:block;font-size:13px}
.alert .tx span{font-size:11.5px;color:var(--cinza)}

.bar{height:7px;background:var(--carvao3);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--vermelho);border-radius:4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--carvao3);border:1px solid var(--linha);color:var(--branco);padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 8px 26px rgba(0,0,0,.6);max-width:90vw;text-align:center}

@media(min-width:640px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi.wide{grid-column:span 2}
  .vlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet{align-items:center}
  .sheet .inner{border-radius:20px;max-height:88vh}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="ag">AG</span><span class="bar"></span>
    <span class="w"><span class="autos">AUTOS</span><span class="multi">MULTIMARCAS</span></span>
  </div>
  <div class="sub" id="hdSub">Gestão de estoque</div>
</header>

<main id="app"></main>

<nav>
  <button aria-label="painel" data-nav="painel" class="on"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg></span>Painel</button>
  <button aria-label="estoque" data-nav="estoque"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 17h18"/><path d="M5 17v-3.2l1.8-4.3A2 2 0 0 1 8.6 8h6.8a2 2 0 0 1 1.8 1.5L19 13.8V17"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/></svg></span>Estoque</button>
  <button aria-label="novo" data-nav="novo" class="add"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Novo</button>
  <button aria-label="relatorios" data-nav="relatorios"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3.2" height="5"/><rect x="13" y="8" width="3.2" height="9"/></svg></span>Relatórios</button>
  <button aria-label="ajustes" data-nav="ajustes"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg></span>Ajustes</button>
</nav>

<div id="sheet"></div>
<script>
/* =========================================================
   AG AUTOS MULTIMARCAS — Gestão de estoque e centro de custo
   App local: os dados ficam neste aparelho (IndexedDB).
   ========================================================= */

/* ---------- ARMAZENAMENTO ---------- */
const DB={n:'agautos',s:'kv',db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open(this.n,1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(this.s))d.createObjectStore(this.s)};
    r.onsuccess=e=>{this.db=e.target.result;res()};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise(res=>{if(!this.db)return res(null);
    const t=this.db.transaction(this.s,'readonly').objectStore(this.s).get(k);
    t.onsuccess=()=>res(t.result);t.onerror=()=>res(null)})},
  set(k,v){return new Promise(res=>{if(!this.db)return res(false);
    const t=this.db.transaction(this.s,'readwrite').objectStore(this.s).put(v,k);
    t.onsuccess=()=>res(true);t.onerror=()=>res(false)})}
};

let ST={veiculos:[],config:{loja:'AG Autos Multimarcas',endereco:'Av. Rogaciano Leite, 280 – Lojas 05, Salinas, Fortaleza/CE',fone:'(85) 98185-0000',diasAlerta:60,vendedores:['André','Loja']},seq:1};
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{
  const ok=await DB.set('estado',JSON.parse(JSON.stringify(ST)));
  if(!ok){try{localStorage.setItem('agautos',JSON.stringify(ST))}catch(e){toast('⚠ Sem espaço para salvar. Exporte um backup.')}}
},250)}
async function load(){
  try{await DB.open();const d=await DB.get('estado');if(d){ST=Object.assign(ST,d);return}}catch(e){}
  try{const l=localStorage.getItem('agautos');if(l)ST=Object.assign(ST,JSON.parse(l))}catch(e){}
}

/* ---------- UTILITÁRIOS ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>'v'+(ST.seq++)+Date.now().toString(36).slice(-4);
const n=v=>{const x=parseFloat(String(v??'').replace(/\./g,'').replace(',','.'));return isNaN(x)?0:x};
const brl=v=>(v<0?'-':'')+'R$ '+Math.abs(Math.round(v||0)).toLocaleString('pt-BR');
const brl2=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const km=v=>(v||0).toLocaleString('pt-BR')+' km';
const hoje=()=>new Date().toISOString().slice(0,10);
const dbr=d=>d?d.split('-').reverse().join('/'):'—';
const dias=(a,b)=>{if(!a)return 0;const x=new Date(a+'T12:00'),y=b?new Date(b+'T12:00'):new Date();return Math.max(0,Math.round((y-x)/864e5))};
const mesAtual=()=>hoje().slice(0,7);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const byId=id=>ST.veiculos.find(v=>v.id===id);
const vendido=v=>v.status==='vendido'&&v.venda&&n(v.venda.valor)>0;

/* ---------- CÁLCULO: CENTRO DE CUSTO POR VEÍCULO ---------- */
function cc(v){
  const custos=(v.custos||[]);
  const pago=custos.filter(c=>c.pago).reduce((s,c)=>s+n(c.valor),0);
  const previsto=custos.filter(c=>!c.pago).reduce((s,c)=>s+n(c.valor),0);
  const totalCustos=pago+previsto;
  const compra=n(v.valorCompra);
  const investido=compra+totalCustos;                 // capital aplicado no veículo
  const vd=v.venda||{};
  const vendeu=v.status==='vendido'&&n(vd.valor)>0;
  const venda=n(vd.valor);
  const comissao=n(vd.comissao);
  const retorno=n(vd.retornoBanco);                   // retorno de financiamento (entra como receita)
  const bruto=vendeu?venda-investido:0;
  const liquido=vendeu?bruto-comissao+retorno:0;
  const margem=vendeu&&venda>0?liquido/venda*100:0;
  const roi=vendeu&&investido>0?liquido/investido*100:0;
  const prevLucro=!vendeu&&n(v.precoAnuncio)>0?n(v.precoAnuncio)-investido:0;
  const diasEstoque=vendeu?dias(v.dataCompra,vd.data):dias(v.dataCompra);
  return {pago,previsto,totalCustos,compra,investido,venda,comissao,retorno,bruto,liquido,margem,roi,prevLucro,vendeu,diasEstoque};
}

/* ---------- ALERTAS ---------- */
function alertas(){
  const a=[];const lim=ST.config.diasAlerta||60;
  ST.veiculos.forEach(v=>{
    const k=cc(v);
    if(v.status!=='vendido'&&k.diasEstoque>lim)
      a.push({c:'var(--ambar)',t:`${nomeV(v)} parado há ${k.diasEstoque} dias`,s:`Investido ${brl(k.investido)} — avaliar preço ou repasse`,id:v.id});
    (v.custos||[]).filter(c=>!c.pago&&c.situacao!=='concluido').forEach(c=>
      a.push({c:'var(--vermelho)',t:`Serviço pendente: ${c.descricao||c.tipo}`,s:`${nomeV(v)} — ${brl(n(c.valor))} (${c.situacao==='executando'?'em execução':'orçado'})`,id:v.id}));
    const d=v.docs||{};
    if(v.status!=='vendido'){
      if(!d.crvOk) a.push({c:'var(--cinza)',t:`CRV/DUT pendente`,s:nomeV(v),id:v.id});
      if(d.ipvaAberto) a.push({c:'var(--ambar)',t:`IPVA em aberto`,s:`${nomeV(v)} — ${brl(n(d.ipvaValor))}`,id:v.id});
      if(n(d.multas)>0) a.push({c:'var(--vermelho)',t:`Multas a quitar`,s:`${nomeV(v)} — ${brl(n(d.multas))}`,id:v.id});
    }
    if(v.status==='vendido'&&d.garantiaAte){
      const dd=Math.round((new Date(d.garantiaAte+'T12:00')-new Date())/864e5);
      if(dd>=0&&dd<=15) a.push({c:'var(--ouro)',t:`Garantia vence em ${dd} dia(s)`,s:`${nomeV(v)} — até ${dbr(d.garantiaAte)}`,id:v.id});
    }
    if(v.status==='vendido'&&!vendido(v))
      a.push({c:'var(--vermelho)',t:'Venda sem valor lançado',s:`${nomeV(v)} — o lucro não entra nos relatórios assim`,id:v.id});
    if(v.status!=='vendido'&&v.origem==='consignado'&&!v.consignante)
      a.push({c:'var(--ouro)',t:`Consignado sem dono cadastrado`,s:nomeV(v),id:v.id});
  });
  return a;
}

/* ---------- ESTOQUE ---------- */
function viewEstoque(){
  let lista=ST.veiculos.filter(v=>{
    if(filtro==='patio'&&v.status==='vendido')return false;
    if(['estoque','reservado','consignado','vendido'].includes(filtro)&&v.status!==filtro)return false;
    if(busca){const t=(nomeV(v)+' '+(v.placa||'')+' '+anoV(v)+' '+(v.cor||'')).toLowerCase();if(!t.includes(busca.toLowerCase()))return false}
    return true;
  }).sort((a,b)=>{
    if(a.status==='vendido'&&b.status!=='vendido')return 1;
    if(b.status==='vendido'&&a.status!=='vendido')return -1;
    return (b.dataCompra||'').localeCompare(a.dataCompra||'');
  });
  const q=f=>ST.veiculos.filter(v=>f==='todos'?1:f==='patio'?v.status!=='vendido':v.status===f).length;
  const fs=[['todos','Todos'],['patio','No pátio'],['estoque','Disponível'],['reservado','Reservado'],['consignado','Consignado'],['vendido','Vendidos']];
  const patio=lista.filter(v=>v.status!=='vendido');
  return `
  <h2 class="tit">Estoque</h2>
  <p class="sub">${lista.length} listado(s)${patio.length?` · ${brl(patio.reduce((s,v)=>s+cc(v).investido,0))} aplicados no pátio`:''}</p>
  <input class="busca" id="bq" placeholder="Buscar modelo, placa, ano…" value="${esc(busca)}">
  <div class="filtros">${fs.map(([k,l])=>`<button class="chip ${filtro===k?'on':''}" data-f="${k}">${l} <i>${q(k)}</i></button>`).join('')}</div>
  <div class="vlist">${lista.length?lista.map(vcard).join(''):`<div class="vazio">${SVG_CARRO}<p>Nada encontrado aqui.</p><small>Tente outro filtro ou limpe a busca.</small></div>`}</div>`;
}

  on('#bExcluir',()=>{if(confirm('Excluir '+nomeV(v)+' e todo o seu histórico? Não dá para desfazer.')){ST.veiculos=ST.veiculos.filter(x=>x.id!==v.id);save();detId=null;nav('estoque')}});

  on('#qVender',()=>formVenda(v));

  on('#qFoto',()=>{abaDet='fotos';render();setTimeout(()=>{const f=$('#fileFoto');f&&f.click()},120)});
  on('#qShare',()=>anuncio(v));
  on('#heroBox',()=>{abaDet='fotos';render();if(!(v.fotos||[]).length)setTimeout(()=>{const f=$('#fileFoto');f&&f.click()},120)});
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{
    v.status=b.dataset.st;if(v.status==='consignado')v.origem='consignado';save();render();toast('Situação: '+b.textContent.trim())});
  document.querySelectorAll('[data-editc]').forEach(b=>b.onclick=()=>formCusto(v,(v.custos||[]).find(c=>c.id===b.dataset.editc)));
  document.querySelectorAll('[data-pagar]').forEach(b=>b.onclick=()=>{
    const c=(v.custos||[]).find(x=>x.id===b.dataset.pagar);c.pago=true;c.situacao='concluido';save();render();toast('Baixa registrada')});
  on('#salvarDocs',()=>{
    v.docs={crvOk:$('#dCrv').checked,transferido:$('#dTransf').checked,ipvaAberto:$('#dIpva').checked,
      ipvaValor:$('#dIpvaV').value,multas:$('#dMultas').value,despachante:$('#dDesp').value,garantiaAte:$('#dGar').value,obs:$('#dObs').value};
    save();toast('Documentação salva');render()});
  const fi=$('#fileFoto');
  on('#addFoto',()=>fi.click());
  if(fi)fi.onchange=async e=>{
    const fs=[...e.target.files];if(!fs.length)return;toast('Processando '+fs.length+' foto(s)…');
    v.fotos=v.fotos||[];
    for(const f of fs){try{v.fotos.push(await comprime(f))}catch(err){}}
    save();render();toast('Foto(s) adicionada(s)');
  };
  document.querySelectorAll('[data-capa]').forEach(g=>g.onclick=e=>{
    if(e.target.dataset.delf!==undefined)return;
    v.capa=+g.dataset.capa;save();render();toast('Capa definida')});
  document.querySelectorAll('[data-delf]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();const i=+b.dataset.delf;
    if(!confirm('Apagar esta foto?'))return;
    const c=v.capa||0;
    v.fotos.splice(i,1);
    v.capa=(i===c)?0:(i<c?c-1:c);
    if(v.capa>=v.fotos.length)v.capa=0;
    save();render()});
}

/* ---------- TEXTO DE ANÚNCIO (WhatsApp / OLX) ---------- */
function anuncio(v){
  const L=[];
  L.push(`🚗 ${nomeV(v)}`.replace('🚗',v.categoria==='moto'?'🏍':'🚗'));
  if(anoV(v))L.push(`📅 Ano ${anoV(v)}`);
  if(n(v.km))L.push(`⏱ ${km(n(v.km))}`);
  const fic=[v.cor,v.combustivel,v.cambio].filter(Boolean).join(' · ');
  if(fic)L.push(`⚙️ ${fic}`);
  if(n(v.precoAnuncio))L.push(`💰 ${brl(n(v.precoAnuncio))}`);
  if(v.obs)L.push(`\n${v.obs}`);
  L.push(`\n✅ Compra, vende, troca e financia\n📍 ${ST.config.endereco}\n📲 ${ST.config.fone}`);
  const txt=L.join('\n');
  const ok=()=>{toast('Anúncio copiado ✓');sheet('Texto do anúncio',
    `<textarea id="anTxt" style="width:100%;min-height:230px;background:var(--carvao2);border:1px solid var(--linha);border-radius:11px;padding:12px">${esc(txt)}</textarea>
     <div class="btnrow"><button class="btn btn-s" id="anFechar">Fechar</button>
     <a class="btn btn-p" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Enviar no WhatsApp</a></div>`,
    ()=>{$('#anFechar').onclick=fecha})};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(ok,ok);else ok();
}

/* ---------- COMPRESSÃO DE FOTO ---------- */
function comprime(file,max=1280,q=.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();
      img.onload=()=>{let{width:w,height:h}=img;
        if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',q))};
      img.onerror=rej;img.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- SHEETS (FORMULÁRIOS) ---------- */
function sheet(titulo,html,onMount){
  $('#sheet').innerHTML=`<div class="sheet"><div class="inner"><div class="grab"></div><h3>${titulo}</h3>${html}</div></div>`;
  const s=$('#sheet .sheet');
  s.onclick=e=>{if(e.target===s)fecha()};
  document.body.style.overflow='hidden';
  onMount&&onMount();
  ligaMoney();
}
/* eco do valor digitado, para não errar um zero */
function ligaMoney(){
  document.querySelectorAll('#sheet input[step="0.01"]').forEach(i=>{
    const h=document.createElement('div');h.className='hint';
    i.parentNode.appendChild(h);
    const up=()=>{const val=n(i.value);h.textContent=val?brl2(val):''};
    i.addEventListener('input',up);up();
  });
  /* data por extenso, porque o teclado do aparelho pode mostrar mm/dd */
  document.querySelectorAll('#sheet input[type="date"]').forEach(i=>{
    const h=document.createElement('div');h.className='hint';i.parentNode.appendChild(h);
    const S=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
    const up=()=>{h.textContent=i.value?S[new Date(i.value+'T12:00').getDay()]+', '+dbr(i.value):''};
    i.addEventListener('input',up);i.addEventListener('change',up);up();
  });
}

function viewRelatorios(){
  const vend=ST.veiculos.filter(v=>vendido(v)&&v.venda.data);
  const meses={};
  vend.forEach(v=>{const m=v.venda.data.slice(0,7);const k=cc(v);
    meses[m]=meses[m]||{q:0,fat:0,luc:0,cst:0};
    meses[m].q++;meses[m].fat+=k.venda;meses[m].luc+=k.liquido;meses[m].cst+=k.totalCustos});
  const ms=Object.entries(meses).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);
  const maxL=Math.max(1,...ms.map(([,x])=>Math.abs(x.luc)));
  const rank=vend.map(v=>({v,k:cc(v)})).sort((a,b)=>b.k.liquido-a.k.liquido);
  const custosTipo={};ST.veiculos.forEach(v=>(v.custos||[]).forEach(c=>custosTipo[c.tipo]=(custosTipo[c.tipo]||0)+n(c.valor)));
  const totC=Object.values(custosTipo).reduce((a,b)=>a+b,0);
  const fatT=vend.reduce((s,v)=>s+cc(v).venda,0),lucT=vend.reduce((s,v)=>s+cc(v).liquido,0);
  const mn=v=>{const[a,b]=v.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+b-1]+'/'+a.slice(2)};

  return `
  <h2 class="tit">Relatórios</h2>
  <p class="sub">${vend.length} venda(s) no histórico</p>
  <div class="kpis">
    <div class="kpi"><div class="lb">Faturamento total</div><div class="vl">${brl(fatT)}</div></div>
    <div class="kpi g"><div class="lb">Lucro total</div><div class="vl ${lucT>=0?'pos':'neg'}">${brl(lucT)}</div><div class="ft">margem ${fatT?(lucT/fatT*100).toFixed(1):'0'}%</div></div>
    <div class="kpi"><div class="lb">Ticket médio</div><div class="vl">${brl(vend.length?fatT/vend.length:0)}</div></div>
    <div class="kpi"><div class="lb">Lucro médio/carro</div><div class="vl">${brl(vend.length?lucT/vend.length:0)}</div></div>
  </div>

  ${ms.length?`<div class="card"><h3>Resultado por mês</h3>
    ${ms.map(([m,x])=>`<div style="margin-bottom:11px">
      <div class="lin" style="border:none;padding:2px 0"><span class="k">${mn(m)} · ${x.q} venda(s)</span>
      <span class="v ${x.luc>=0?'pos':'neg'}">${brl(x.luc)}</span></div>
      <div class="bar"><i style="width:${Math.abs(x.luc)/maxL*100}%;background:${x.luc>=0?'var(--verde)':'var(--vermelho)'}"></i></div>
      <div style="font-size:11px;color:var(--cinza2);margin-top:3px">faturou ${brl(x.fat)} · custos ${brl(x.cst)}</div></div>`).join('')}
  </div>`:''}

  ${rank.length?`<div class="card"><h3>Ranking por veículo</h3>
    ${rank.slice(0,10).map(({v,k},i)=>`<div class="item" data-abrir="${v.id}"><div class="ib">
      <div class="it">${i+1}. ${esc(nomeV(v))}</div>
      <div class="id">${dbr(v.venda.data)} · ${k.diasEstoque}d · margem ${k.margem.toFixed(1)}%</div></div>
      <div class="iv ${k.liquido>=0?'pos':'neg'}">${brl(k.liquido)}</div></div>`).join('')}
  </div>`:''}

  ${totC?`<div class="card"><h3>Custos por tipo <span class="cnt">${brl(totC)}</span></h3>
    ${Object.entries(custosTipo).sort((a,b)=>b[1]-a[1]).map(([t,val])=>`<div style="margin-bottom:9px">
      <div class="lin" style="border:none;padding:2px 0"><span class="k">${esc(t)}</span><span class="v">${brl(val)} · ${(val/totC*100).toFixed(0)}%</span></div>
      <div class="bar"><i style="width:${val/totC*100}%"></i></div></div>`).join('')}
  </div>`:''}

  ${ST.veiculos.length?`<div class="btnrow"><button class="btn btn-s" onclick="exportCSV()">⬇ Exportar planilha (CSV)</button></div>`:
    `<div class="vazio"><div class="e">📊</div><p>Sem dados ainda.</p><small>Os relatórios aparecem conforme você registra compras e vendas.</small></div>`}`;
}

async function exportCSV(){
  const h=['Categoria','Marca','Modelo','Versão','Ano','Placa','KM','Origem','Situação','Data compra','Valor compra','Custos pagos','Custos previstos','Custo total','Preço anúncio','Data venda','Valor venda','Retorno banco','Comissão','Lucro líquido','Margem %','Dias no pátio'];
  const linhas=ST.veiculos.map(v=>{const k=cc(v);const s=v.venda||{};
    return [v.categoria,v.marca,v.modelo,v.versao,anoV(v),v.placa,n(v.km),v.origem,v.status,v.dataCompra,k.compra,k.pago,k.previsto,k.investido,n(v.precoAnuncio),s.data||'',k.venda,k.retorno,k.comissao,k.liquido,k.vendeu?k.margem.toFixed(1):'',k.diasEstoque]
      .map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')});
  if(await baixa('ag-autos-estoque-'+hoje()+'.csv','﻿'+[h.join(';'),...linhas].join('\n'),'text/csv'))toast('Planilha gerada ✓');
}
async function baixa(nome,conteudo,tipo){
  const b=new Blob([conteudo],{type:tipo+';charset=utf-8'});
  /* na versão hospedada o navegador não deixa a página baixar sozinha:
     pede ao aplicativo para salvar. No arquivo local, usa o link mesmo. */
  try{
    const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:nome,data:b});return true}
  }catch(e){
    if(!(e&&e.code==='declined'))toast('Não consegui salvar o arquivo neste aparelho.');
    return false;
  }
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
  return true;
}

/* ---------- APP INSTALÁVEL (PWA) ---------- */
/* Sem aviso de atualização: estando online o app sempre abre o que está
   publicado, recarregando UMA vez sozinho quando a versão nova assume. */
const APP_VERSAO='v1.1.0';
(function(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol==='file:')return;            /* só funciona servido por http(s) */
  const tinhaControle=!!navigator.serviceWorker.controller;
  let recarregou=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!tinhaControle)return;                       /* 1ª instalação: nada a recarregar */
    if(recarregou)return;                           /* trava contra laço de recarga */
    recarregou=true;location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    /* procura versão nova toda vez que o app volta para a tela */
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
})();
/* versão real em uso, perguntada ao service worker */
function mostraVersao(){
  const el=document.getElementById('verApp');if(!el)return;
  el.textContent=APP_VERSAO;
  const c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(!c)return;
  const ch=new MessageChannel();
  ch.port1.onmessage=ev=>{
    const v=ev.data&&ev.data.versao;if(!v)return;
    el.textContent=(v===APP_VERSAO)?v:v+' (página '+APP_VERSAO+')';
  };
  try{c.postMessage({type:'VERSAO'},[ch.port2])}catch(e){}
}
